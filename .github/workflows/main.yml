#Filename: main.yml
#Author: Kyle McColgan
#Date: 26 August 2026
#Description: This file contains the GitHub Actions Workflow and GitHub Pages deployment processes for the Saint Louis Events project.

name: main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '24'

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm test

    - name: Build the project
      run: npm run build

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages           # The branch to push to.
        folder: dist               # Vite's build folder is dist.
        token: ${{ secrets.GH_TOKEN }}  # Using the PAT secret for deployment.
